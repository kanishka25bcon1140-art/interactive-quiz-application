<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="shell">
        <header class="hero">
            <p class="kicker">Code With AI</p>
            <h1>Quiz</h1>
            <div class="progress" aria-hidden="true">
                <span id="progress-fill"></span>
            </div>
            <p id="step" class="step"></p>
        </header>

        <section id="quiz" class="card">
            <h2 id="question"></h2>
            <div id="options" class="options"></div>
        </section>

        <p id="result" class="result"></p>
    </main>

    <script src="script.js"></script>
</body>
</html>
